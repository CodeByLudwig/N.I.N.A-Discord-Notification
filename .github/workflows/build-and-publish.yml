name: Release Build

on:
  release:
    types: [created]

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x

    - name: Build Release DLL
      run: dotnet build -c Release --no-restore

    - name: List Build Files (Debug)
      run: dir bin\Release /s  # Windows CMD-Befehl zur Pfadkontrolle

    - name: Find DLL
      id: find-dll
      shell: pwsh
      run: |
        $dll = Get-ChildItem -Path "bin/Release/net8.0-windows*" -Recurse -Filter *.dll |
               Where-Object { $_.Name -notlike '*Test*' } |
               Select-Object -First 1
        
        if (-not $dll) { 
            Write-Error "❌ Keine DLL in bin/Release/net8.0-windows gefunden"
            exit 1 
        }
        echo "dll_path=$($dll.FullName)" >> $env:GITHUB_OUTPUT

    - name: Upload DLL to Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.find-dll.outputs.dll_path }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
