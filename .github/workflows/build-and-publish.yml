name: Release Build

on:
  release:
    types: [created]

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Release
      run: dotnet build -c Release --no-restore

    - name: Find DLLs
      id: find-dlls
      shell: pwsh
      run: |
        $dlls = Get-ChildItem -Path ./bin/Release/ -Recurse -Filter *.dll | Select-Object -ExpandProperty FullName
        if (-not $dlls) { Write-Error "No DLL files found"; exit 1 }
        echo "dll_paths=$($dlls -join ',')" >> $env:GITHUB_OUTPUT

    - name: Upload DLLs to Release
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.find-dlls.outputs.dll_paths }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
