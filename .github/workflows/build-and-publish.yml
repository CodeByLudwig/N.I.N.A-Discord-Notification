name: Release Build

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Release
      run: dotnet publish -c Release --no-restore -o ./bin/Release/net8.0-windows/publish

    - name: Validate Published DLLs
      shell: pwsh
      run: |
        $publishDir = "bin/Release/net8.0-windows/publish"
        $requiredDlls = @(
            "DiscordNotification.dll",
            "Discord.Net.Webhook.dll",
            "Discord.Net.Core.dll",
            "Discord.Net.Rest.dll"
        )
        foreach ($dll in $requiredDlls) {
            $dllPath = Join-Path $publishDir $dll
            if (-not (Test-Path $dllPath)) {
                Write-Error "❌ Required DLL not found: $dllPath"
                exit 1
            }
        }

    - name: Create ZIP Archive
      shell: pwsh
      run: |
        $publishDir = "bin/Release/net8.0-windows/publish"
        $zipPath = "bin/Release/DiscordNotification.zip"
        
        Compress-Archive `
          -Path (
            "$publishDir/DiscordNotification.dll",
            "$publishDir/Discord.Net.Webhook.dll",
            "$publishDir/Discord.Net.Core.dll",
            "$publishDir/Discord.Net.Rest.dll"
          ) `
          -DestinationPath $zipPath `
          -Force

    - name: Validate ZIP Archive
      shell: pwsh
      run: |
        $zipPath = "bin/Release/DiscordNotification.zip"
        if (-not (Test-Path $zipPath)) {
            Write-Error "❌ ZIP-Datei nicht gefunden: $zipPath"
            exit 1
        }

    - name: Upload ZIP to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          bin/Release/DiscordNotification.zip
        generate_release_notes: true
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
