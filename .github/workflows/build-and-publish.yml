name: Release Build

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Setup .NET 8.x
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Publish Release
      run: dotnet publish -c Release --no-restore -o ./bin/Release/net8.0-windows/publish
